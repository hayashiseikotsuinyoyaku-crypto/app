<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>試し用 受付</title>
<meta name="apple-mobile-web-app-title" content="試し用 受付">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="test-uketsuke.webmanifest">
<link rel="apple-touch-icon" href="test-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="test-icon.png">
<style>
html,body{margin:0;height:100%;background:#fff}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#2B2723}
#app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
img{width:110px;height:110px;border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{font-size:22px;margin:0}
ol{text-align:left;font-size:17px;line-height:1.8;max-width:340px;padding-left:1.4em;margin:0}
.note{font-size:14px;color:#6B635B;max-width:340px}
a.btn{display:inline-block;background:#115C55;color:#fff;text-decoration:none;font-weight:700;padding:12px 28px;border-radius:999px}
[hidden]{display:none!important}
</style>
</head><body>
<div class="box" id="setup" hidden>
  <img src="test-icon.png" alt="">
  <h1>試し用 受付</h1>
  <ol>
    <li>下の <b>共有ボタン</b>（□に↑のマーク）を押す<br><small>iPadは右上にあります</small></li>
    <li><b>「ホーム画面に追加」</b>を押す</li>
    <li>名前が「試し用 受付」になっているのを確かめて<b>「追加」</b></li>
  </ol>
  <p class="note">追加したら、ホーム画面のアイコンから開いてください。<br>Androidのスマホは、右上の︙ →「ホーム画面に追加」です。</p>
  <p><a class="btn" href="https://script.google.com/macros/s/AKfycbyfjWTEVU0y7H9pH9mQ05gtwD8D0aIedDasZT1g7d4WIEgee0p_h0xPkJ7O6NXI5U24CA/exec?p=uketsuke" target="_blank" rel="noopener">今すぐ開いてみる</a></p>
</div>
<iframe id="app" hidden title="試し用 受付" allow="camera; clipboard-write; fullscreen"></iframe>
<script>
/* ログインを覚える：中の予約システム（Googleの画面）から頼まれた分だけ、この端末に保存する（代表 10/14） */
window.addEventListener('message', function (e) {
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  var d = e.data || {}; if (d.ts !== 'hayashi' || !/^[\w-]{1,40}$/.test(String(d.k || ''))) return;
  var K = 'hs:' + location.pathname + ':' + d.k, v = null;
  try {
    if (d.op === 'get') v = localStorage.getItem(K);
    else if (d.op === 'set') localStorage.setItem(K, String(d.v).slice(0, 500));
    else if (d.op === 'del') localStorage.removeItem(K);
  } catch (x) {}
  try { e.source.postMessage({ts: 'hayashi', id: d.id, v: v}, e.origin); } catch (x) {}
});
</script>
<script>
var DEST = 'https://script.google.com/macros/s/AKfycbyfjWTEVU0y7H9pH9mQ05gtwD8D0aIedDasZT1g7d4WIEgee0p_h0xPkJ7O6NXI5U24CA/exec?p=uketsuke';
if (/(^|[?&])setup(=|&|$)/.test(location.search)) {
  document.getElementById('setup').hidden = false;
  history.replaceState(null, '', location.pathname);
} else {
  var f = document.getElementById('app'); f.src = DEST; f.hidden = false;
}
</script>
<script>
/* 11/6：iPhone・iPadで、文字を入れたあと（キーボードが閉じたあと）に押す場所がずれる（代表 11/6：設定のリッチメッセージ）。
   キーボードで外側の画面が少し上にずれたまま戻らないのが原因なので、キーボードが閉じたら外側の画面を元の位置に戻す */
(function(){
  function fix(){try{if(window.scrollX||window.scrollY)window.scrollTo(0,0);if(document.documentElement.scrollTop)document.documentElement.scrollTop=0;if(document.body&&document.body.scrollTop)document.body.scrollTop=0}catch(e){}}
  var vv=window.visualViewport;
  function closed(){return (!vv||(vv.height>=window.innerHeight*0.85&&!(vv.scale>1.01)))}   // ピンチで拡大中は動かさない（監査#8）
  function fits(){var d=document.documentElement;return d.scrollHeight<=window.innerHeight+2}   // 中身が画面より長いページはふつうにスクロールできるように
  function later(){setTimeout(function(){if(closed())fix()},60);setTimeout(function(){if(closed())fix()},400)}
  if(vv){vv.addEventListener('resize',later);vv.addEventListener('scroll',later)}
  window.addEventListener('scroll',function(){if(closed()&&fits())fix()},{passive:true});
  window.addEventListener('orientationchange',later);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)later()});
})();
</script>
<script>
/* 11/13：受付のカメラは、このいちばん外のページで開く（iPadのSafariは、入れ子の中のページにカメラを使わせないため）。
   中の受付画面から「映す場所」を受け取り、同じ場所にカメラの映像を重ねる。QRが読めたら、その中身だけを中の画面に渡す */
(function(){
  var RE=/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/, src=null, origin='', stream=null, det=null, starting=false, lastCode='', lastAt=0, shown=false, timer=null;
  var box=document.createElement('div'); box.id='ukbox'; box.hidden=true;
  box.style.cssText='position:fixed;z-index:5;overflow:hidden;border-radius:22px;background:#222;pointer-events:none';
  /* 11/13：アイコン（ホーム画面）から開くと、自動ではカメラを開かせてもらえないことがある（代表 11/13）。そのときは、この枠に大きなボタンを出して、押してもらってからカメラを開く */
  box.innerHTML='<video id="ukv" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block"></video><div id="ukfr" style="position:absolute;top:14%;bottom:14%;left:22%;right:22%;border:5px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.28)"></div>'
    +'<button id="ukgo" type="button" hidden style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#222;color:#fff;font:800 26px/1.6 -apple-system,\'Hiragino Sans\',sans-serif;padding:20px;pointer-events:auto">ここを押して<br>カメラをオンにしてください<br><span id="ukgoe" style="font-size:15px;font-weight:500;opacity:.8"></span></button>';
  document.body.appendChild(box);
  /* 11/14：どの版が動いているか・カメラがどうなっているかを、枠の右下に小さく出す（アイコンから開いたときの原因さがし用） */
  var tag=document.createElement('div'); tag.id='uktag'; tag.style.cssText='position:absolute;right:8px;bottom:6px;z-index:3;font:600 11px/1.2 -apple-system,sans-serif;color:#fff;opacity:.7;pointer-events:none;text-shadow:0 0 3px #000'; box.appendChild(tag);
  var CAMV='c3', dark=0;
  function note(t){try{tag.textContent=CAMV+' '+t}catch(e){}}
  var v=box.querySelector('video'), cv=document.createElement('canvas');
  var go=box.querySelector('#ukgo'), goe=box.querySelector('#ukgoe'), fr=box.querySelector('#ukfr'), want=false, failed='';
  function paint(){var needBtn=!stream&&!!failed; go.hidden=!needBtn; fr.style.display=stream?'':'none'; v.style.display=stream?'block':'none'; box.hidden=!(want&&(stream||needBtn)); shown=want&&!!stream}
  go.addEventListener('click',function(){goe.textContent='カメラを開いています…';start(true)});
  function say(m){try{if(src)src.postMessage(m,origin)}catch(e){}}
  function loadJsQR(){if(window.jsQR)return Promise.resolve();var urls=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
    return urls.reduce(function(p,u){return p.catch(function(){return new Promise(function(ok,ng){var s=document.createElement('script');s.src=u;s.onload=function(){window.jsQR?ok():ng()};s.onerror=ng;document.head.appendChild(s)})})},Promise.reject())}
  function found(code){var now=Date.now();if(code===lastCode&&now-lastAt<1500)return;lastCode=code;lastAt=now;say({uk:'scan',code:String(code).slice(0,199)})}
  var scanning=false;
  function scan(){if(!shown||scanning||!v.videoWidth)return;var w=640,h=Math.round(v.videoHeight*640/v.videoWidth);cv.width=w;cv.height=h;var x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
    try{var px=x.getImageData(0,0,w,h).data,sum=0,cnt=0;for(var i=0;i<px.length;i+=4*997){sum+=px[i]+px[i+1]+px[i+2];cnt+=3}dark=(cnt&&sum/cnt<4)?dark+1:0}catch(e){}
    if(det){scanning=true;det.detect(cv).then(function(a){scanning=false;if(a&&a[0]&&a[0].rawValue)found(a[0].rawValue)},function(){scanning=false})}
    else if(window.jsQR){var d=x.getImageData(0,0,w,h),q=null;try{q=window.jsQR(d.data,w,h,{inversionAttempts:'dontInvert'})}catch(e){}if(q&&q.data)found(q.data)}}
  /* 11/14（代表 11/14）：アイコン（ホーム画面）から開くと、カメラが一瞬ついてすぐ止まる（赤いカメラの印が出て消える・緑の点がつかない・映像が黒い）。
     iPad が、つないだカメラを止めてしまう（止められた・終わった・映像が進まない）のを1秒ごとに見はって、止まっていたら つなぎ直す。
     2回つなぎ直してもだめなら、枠に「ここを押してください」を出す（指で押してから開くと、iPad が止めにくい）。理由も小さく出す */
  var tries=0, lastT=-1, stuck=0, good=0, wd=null;
  function drop(){try{if(stream)stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}})}catch(e){} stream=null; try{v.srcObject=null}catch(e){} clearInterval(timer); clearInterval(wd); wd=null; lastT=-1; stuck=0}
  function watch(){clearInterval(wd); good=0; wd=setInterval(function(){
    if(!stream||document.hidden)return; var tr=stream.getVideoTracks()[0], why='';
    if(!tr||tr.readyState==='ended')why='ended'; else if(tr.muted)why='muted';
    else{ if(v.paused){v.play().catch(function(){})} if(v.currentTime===lastT){stuck++; if(stuck>=3)why='stuck'} else {stuck=0; good++; if(good>=10)tries=0} lastT=v.currentTime }
    if(!why&&dark>=14)why='black';   // 映像は進んでいるのに、3秒つづけて真っ黒
    note(why?('x '+why+' '+tries):('ok '+(tr&&tr.label?'':'-')+Math.round(v.currentTime)));
    if(!why)return;
    dark=0; drop(); tries++;
    if(tries<=2){start()} else {failed=why; goe.textContent='カメラが止まりました（'+why+'）。押すと もう一度つなぎます'; paint(); say({uk:'camstate',state:'err',name:'Stopped-'+why})}
  },1000)}
  function start(byTap){
    if(byTap)tries=0;
    if(stream){say({uk:'camstate',state:'ok'});return} if(starting)return; starting=true;
    say({uk:'camstate',state:'wait'});   // 「外で引き受けました」とすぐ知らせる（中の画面が待ちきれずに自分でカメラを開こうとしないように）
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){starting=false;failed='NoCamera';goe.textContent='この端末ではカメラが使えません（Safariで開いてください）';paint();say({uk:'camstate',state:'err',name:'NoCamera'});return}
    var ready=('BarcodeDetector' in window)?(function(){try{det=new BarcodeDetector({formats:['qr_code']});return Promise.resolve()}catch(e){det=null;return loadJsQR()}})():loadJsQR();
    ready.catch(function(){}); note('open '+tries); navigator.mediaDevices.getUserMedia(tries>=1?{audio:false,video:true}:{audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}})
    .then(function(s){stream=s;v.srcObject=s;return v.play()})
    .then(function(){starting=false;failed='';paint();say({uk:'camstate',state:'ok'});clearInterval(timer);timer=setInterval(scan,220);watch();try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}})
    .catch(function(e){note('err '+((e&&e.name)||''));starting=false;drop();failed=(e&&e.name)||'Error';goe.textContent=byTap?('カメラを開けませんでした（'+failed+'）。設定→Safari→カメラ を「許可」にして、もう一度押してください'):'';paint();say({uk:'camstate',state:'err',name:failed})});
  }
  window.addEventListener('message',function(e){
    if(!RE.test(e.origin))return; var d=e.data||{}; if(d.uk!=='cam')return; src=e.source; origin=e.origin;
    if(d.op==='start')start();
    else if(d.op==='rect'){var f=document.getElementById('app').getBoundingClientRect(), n=function(x){x=Number(x);return isFinite(x)?x:0};
      var sx=d.vw>0?f.width/n(d.vw):1, sy=d.vh>0?f.height/n(d.vh):1;
      box.style.left=(f.left+n(d.x)*sx)+'px';box.style.top=(f.top+n(d.y)*sy)+'px';box.style.width=Math.max(0,n(d.w)*sx)+'px';box.style.height=Math.max(0,n(d.h)*sy)+'px';
      want=!!d.show&&n(d.w)>40; paint();}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden){want=false;paint()}else if(stream&&v.paused){v.play().catch(function(){})}});
})();
</script>
</body></html>
