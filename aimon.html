<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AI問診の録音</title><meta name="robots" content="noindex">
<style>
/* AI問診（試し・11/7版l）：予約システムの画面（Google の枠の中）ではマイクが使えないので、録音だけをこのページで行う。
   録音はこのページの中だけで持ち、予約システム経由でAIに渡したら捨てる（保存しない）。下書きはカルテに出る */
:root{--bg:#f4f7f6;--card:#fff;--ink:#1f2a30;--sub:#5a6b70;--line:#d6e0de;--teal:#1f6f63;--teal2:#e3f0ed;--red:#c0392b;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:16px}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--teal2);color:var(--teal);padding:2px 8px;border-radius:99px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;text-align:center}
.who{font-size:20px;font-weight:800}
.sub{color:var(--sub);font-size:14.5px;line-height:1.7}
button{font:inherit;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:14px 18px;cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:default}
.big{font-size:24px;padding:26px 20px;border:0;background:var(--teal);color:#fff;width:100%}
.big.stop{background:var(--red)}
.time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--red);margin-right:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.meter{height:10px;background:#eef2f1;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .1s}
.ok{color:var(--teal);font-weight:800;font-size:20px}
.err{color:var(--red);font-weight:700}
/* 11/7版q：カルテの下に小さな枠で出す（カルテを見ながら・書きながら録れる・代表 11/7） */
html.mini,html.mini body{background:transparent}
html.mini main{padding:0;max-width:none;gap:0}
html.mini main>h1,html.mini main>.sub{display:none}
html.mini .card{border-radius:16px;padding:10px 12px;gap:8px;text-align:left;display:flex;flex-wrap:wrap;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.25);border-color:#9fb8b2;min-height:76px}
html.mini .card .who{font-size:16px}
html.mini .card .sub{font-size:13px;flex:1 1 200px}
html.mini .big{font-size:17px;padding:12px 16px;width:auto;flex:0 0 auto}
html.mini button{padding:10px 14px}
html.mini .time{font-size:24px}
html.mini .meter{flex:1 1 80px;min-width:60px}
html.mini .err{flex:1 1 100%;font-size:13.5px}
html.mini .ok{font-size:16px}
</style></head><body>
<main>
  <h1>🎤 AI問診の録音 <span class="tag">試し</span></h1>
  <div class="card" id="box"><div class="sub">読み込んでいます…</div></div>
  <div class="sub">録音はこの画面の中だけで持ち、AIに渡したらすぐ消します（どこにも保存しません）。<br>録音のあいだは、iPadの画面を消さないでください（消すと録音が止まることがあります）。</div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search),T=Q.get('t')||'',A=Q.get('a')||'';
const EMB=Q.get('embed')==='1'&&window.parent!==window;
const MINI=EMB&&Q.get('mini')==='1';if(MINI)document.documentElement.classList.add('mini');
const OKP=/^[0-9a-f]{40}$/.test(T)&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(A);
let INFO=null,R=null,WL=null;
async function api(op,body,ms){const ac=window.AbortController?new AbortController():null,tm=ac?setTimeout(()=>ac.abort(),ms||60000):0;
  try{const r=await fetch(A,{method:'POST',body:JSON.stringify(Object.assign({op,t:T},body||{})),signal:ac?ac.signal:undefined});return await r.json()}finally{clearTimeout(tm)}}
const mmss=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
const pickMime=()=>{try{return ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||''}catch(e){return ''}};
function size(){if(!EMB)return;try{window.parent.postMessage({ts:'hayashi',op:'aimSize',h:Math.ceil($('#box').getBoundingClientRect().height)+4},location.origin)}catch(e){}}
function show(h){$('#box').innerHTML=h+(EMB&&!R&&h.indexOf('id="back"')<0?`<button id="x" ${MINI?'':'style="margin-top:4px"'}>閉じる${MINI?'':'（カルテに戻る）'}</button>`:'');const x=$('#x');if(x)x.onclick=back;setTimeout(size,0)}
function back(){if(R)stop(true);try{window.parent.postMessage({ts:'hayashi',op:'aimClose'},location.origin)}catch(e){}}
function idle(msg){show(MINI?`<div class="who">🎤 ${esc(INFO.name)} 様</div>${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="big" id="go">● 記録をはじめる</button>`
  :`<div class="who">${esc(INFO.name)} 様</div><div class="sub">${INFO.kind==='acc'?'交通事故':'一般'}・担当 ${esc(INFO.staff||'')}</div>
  ${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="big" id="go">🎤 記録をはじめる</button>
  <div class="sub">問診のあいだ押したままにしなくて大丈夫です。終わったら「終わり」を押します（15分まで）。</div>`);$('#go').onclick=start}
/* 11/7版r：長い問診（30分以上）でも時間切れにならないように、5分ごとに区切って、録りながら少しずつ送る（区切りごとに予約システムで文字にしておく）。
   「終わり」で残りを送り、全部の文字と電子問診票から下書きを作る。上限60分 */
let Q2=[],QB=false,SENT=0,FAIL=0;
async function pump(){if(QB)return;QB=true;
  while(Q2.length){const it=Q2[0];let r=null;
    for(let k=0;k<3&&!(r&&r.ok);k++){try{r=await api('aimSeg',{i:it.i,mime:it.mime,b64:it.b64,sec:it.sec},120000)}catch(e){r=null}if(!(r&&r.ok)&&!(r&&r.error&&!/つながり|返事がありません|503|500|429/.test(r.error)))break;if(!(r&&r.ok))await new Promise(z=>setTimeout(z,3000*(k+1)))}
    if(r&&r.ok){Q2.shift();SENT++}else{it.err=(r&&r.error)||'つながりませんでした';FAIL++;Q2.shift();(window.__FAILED=window.__FAILED||[]).push(it)}
    paintSent()}
  QB=false}
function paintSent(){const e=$('#sent');if(e)e.textContent=SENT?`送った分 ${SENT}区切り`:''}
const b64of=blob=>new Promise((ok,ng)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]||'');f.onerror=ng;f.readAsDataURL(blob)});
function newRec(){const rec=new MediaRecorder(R.st,{mimeType:R.mime,audioBitsPerSecond:32000}),chunks=[],i=R.seg++,t0=Date.now();
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{const blob=new Blob(chunks,{type:R0mime(rec)});chunks.length=0;let b64='';try{b64=await b64of(blob)}catch(e){}Q2.push({i,mime:rec.mimeType||R0.mime,b64,sec:Math.round((Date.now()-t0)/1000)});pump();if(rec.__done)rec.__done()};
  rec.start(1000);R.rec=rec;R.segT0=Date.now()}
let R0={mime:''};const R0mime=rec=>(rec.mimeType||R0.mime).split(';')[0];
function rotate(){if(!R||R.stopping)return;const old=R.rec;newRec();try{old.stop()}catch(e){}}
async function start(auto){const mime=pickMime();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!mime){idle('この端末では録音できません（iPadのSafariで開いてください）。');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){if(auto){idle();return}idle('マイクが使えませんでした。「許可」を押してください。前に「許可しない」を押したときは、iPadの「設定」→「Safari」→「マイク」を「確認」か「許可」にしてください。');return}
  Q2=[];SENT=0;FAIL=0;window.__FAILED=[];R0.mime=mime;
  R={st,mime,t0:Date.now(),sec:0,seg:0};newRec();
  try{WL=navigator.wakeLock?await navigator.wakeLock.request('screen'):null}catch(e){WL=null}
  try{const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();an.fftSize=512;src.connect(an);R.ac=ac;R.an=an;R.buf=new Uint8Array(an.fftSize)}catch(e){}
  show(MINI?`<span class="dot"></span><b>記録中</b><b class="time" id="tm">0:00</b><div class="meter"><i id="mt"></i></div><button class="big stop" id="end">■ 終わり</button><button id="cancel">やめる</button><span class="sub" id="sent" style="flex:0 0 auto"></span>`
    :`<div class="who">${esc(INFO.name)} 様</div><div><span class="dot"></span><b>記録中</b></div><div class="time" id="tm">0:00</div><div class="meter"><i id="mt"></i></div>
    <button class="big stop" id="end">■ 終わり（AIでまとめる）</button><button id="cancel">やめる（録音を消す）</button><div class="sub" id="sent"></div><div class="sub">長い問診でも大丈夫です（60分まで）。5分ごとに少しずつ送っています。</div>`);
  $('#end').onclick=()=>stop(false);$('#cancel').onclick=()=>stop(true);
  const SEG=(INFO.seg||300)*1000;
  R.tick=setInterval(()=>{if(!R)return;R.sec=Math.round((Date.now()-R.t0)/1000);const e=$('#tm');if(e)e.textContent=mmss(R.sec);
    if(R.an){R.an.getByteTimeDomainData(R.buf);let m=0;for(const v of R.buf)m=Math.max(m,Math.abs(v-128));const i=$('#mt');if(i)i.style.width=Math.min(100,m*1.6)+'%'}
    if(R.sec>=(INFO.max||3600)){stop(false);return}
    if(Date.now()-R.segT0>=SEG)rotate()},200)}
function endRec(){if(!R)return;clearInterval(R.tick);try{R.st.getTracks().forEach(t=>t.stop())}catch(e){}try{R.ac&&R.ac.close()}catch(e){}try{WL&&WL.release()}catch(e){}WL=null}
async function fin(X){
  show(MINI?`<div class="sub">⏳ AIがまとめています…（1分ほど）。カルテはそのまま書けます。</div>`:`<div class="who">${esc(INFO.name)} 様</div><div class="sub">AIがまとめています…（1分ほどかかることがあります）</div>`);
  while(QB||Q2.length)await new Promise(z=>setTimeout(z,300));
  let r=null;
  if((window.__FAILED||[]).length){r={error:'送れなかった区切りがあります（'+window.__FAILED[0].err+'）。'}}
  else{try{r=await api('aimFin',{n:X.seg,sec:X.sec},180000)}catch(e){r={error:'つながりませんでした。電波を確かめて、「もう一度送る」を押してください。'}}}
  if(r&&r.ok&&MINI){show('<div class="ok">✓ 下書きができました（カルテに出ます）</div>');setTimeout(back,1200)}
  else if(r&&r.ok)show(`<div class="ok">✓ 下書きができました</div><div class="sub">${EMB?'「閉じる」を押すと、カルテに下書きが出ています。':'予約システムのカルテに戻ってください。下書きが出ています。<br>この画面は閉じて大丈夫です。'}</div>${EMB?'<button class="big" id="back">閉じる（カルテに戻る）</button>':''}<button id="again">もう一度録る</button>`),$('#again').onclick=()=>idle(),EMB&&($('#back').onclick=back);
  else{/* 送れなかった区切りが残っていれば、もう一度送れるようにする（録音はこの画面の中だけにある） */
    const left=(window.__FAILED||[]);
    show(`<div class="err">${esc((r&&r.error)||'うまくいきませんでした。')}</div><button class="big" id="retry">もう一度送る</button><button id="again">録り直す</button>`);
    $('#retry').onclick=()=>{const L=left.splice(0);L.forEach(it=>{delete it.err;Q2.push(it)});FAIL=0;pump();fin(X)};$('#again').onclick=()=>{window.__FAILED=[];idle()}}}
function stop(discard){const X=R;if(!X||X.stopping)return;X.stopping=true;
  if(discard){try{X.rec.onstop=null;X.rec.stop()}catch(e){}endRec();Q2=[];window.__FAILED=[];R=null;if(MINI){back();return}idle('録音を消しました。');return}
  const last=X.rec;last.__done=()=>{R=null;fin(X)};endRecSoon(X);try{last.stop()}catch(e){last.__done()}}
function endRecSoon(X){clearInterval(X.tick);setTimeout(()=>{try{X.st.getTracks().forEach(t=>t.stop())}catch(e){}try{X.ac&&X.ac.close()}catch(e){}try{WL&&WL.release()}catch(e){}WL=null},300)}
/* カルテの「終わり」「やめる」（入口のページ経由） */
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.ts!=='hayashi'||d.op!=='aimCtl')return;
  if(d.cmd==='end'&&R)stop(false);else if(d.cmd==='cancel'){if(R)stop(true);else back()}else if(d.cmd==='start'&&!R&&INFO)start()});
window.addEventListener('beforeunload',e=>{if(R){e.preventDefault();e.returnValue=''}});
(async()=>{if(!OKP){show('<div class="err">この画面は、予約システムのカルテの「🎤問診を記録」から開いてください。</div>');return}
  let r=null;try{r=await api('aimInfo')}catch(e){}
  if(!r||r.error){show(`<div class="err">${esc((r&&r.error)||'予約システムにつながりませんでした。')}</div>`);return}
  INFO=r;idle();if(MINI)start(true)})();   /* 小さな枠：すぐ録りはじめる（マイクの許可がまだなら「記録をはじめる」を押す） */
</script>
</body></html>
